services:
  - type: web
    name: secure-notes-backend
    env: docker
    rootDir: backend
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  - type: web
    name: secure-notes-frontend
    env: docker
    rootDir: frontend
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: secure-notes-backend
          property: host