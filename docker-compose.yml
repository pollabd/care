services:
  mongo:
    image: mongo:7
    container_name: secure-notes-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: secure-notes-backend
    restart: unless-stopped
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/secure_notes}
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_key_for_production}
      - JWT_EXPIRES_IN=7d
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: secure-notes-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
